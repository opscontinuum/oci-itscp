<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Timeline showing RPO before the incident, then RTO to systems available, then WRT to business usable, with MTD spanning RTO plus WRT">
  <style>
    :root { color-scheme: light dark; }
    .bg   { fill: #ffffff; }
    .txt  { fill: #1a1a1a; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mut  { fill: #5c6470; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
    .axis { stroke: #9aa3ad; }
    .tick { stroke: #c2c8d0; }
    .lbl  { font-size: 13px; font-weight: 600; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub  { font-size: 11.5px; }
    .cap  { font-size: 12px; font-weight: 700; letter-spacing: .04em; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ttl  { font-size: 15px; font-weight: 700; }

    /* Accent colors for text drawn ON THE PAGE BACKGROUND. These must follow the
       theme, so they are defined after .txt/.mut and overridden for dark mode. */
    .acc-r { fill: #a50e0e; }

    /* Text drawn ON A FIXED-COLOUR PILL keeps a fixed accent color in both themes,
       because the pill background does not follow the theme. Such elements must NOT
       carry .txt — an SVG presentation attribute has specificity 0 and would lose to
       it, turning the label near-white on a near-white pill in dark mode. */
    .on-r { fill: #a50e0e; }
    .on-b { fill: #0b57d0; }
    .on-o { fill: #a15800; }
    .on-g { fill: #0d652d; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .txt   { fill: #eceff3; }
      .mut   { fill: #a3acb8; }
      .axis  { stroke: #5a6270; }
      .tick  { stroke: #3a4049; }
      .acc-r { fill: #f2867c; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="330"/>

  <text class="txt ttl" x="28" y="34">MTD = RTO + WRT</text>
  <text class="mut sub" x="28" y="54">RPO is measured backwards from the incident; MTD is the only number the business feels.</text>

  <!-- vertical event markers -->
  <line class="tick" x1="300" y1="76" x2="300" y2="266" stroke-width="2"/>
  <line class="tick" x1="540" y1="106" x2="540" y2="266" stroke-dasharray="4 4"/>
  <line class="tick" x1="790" y1="136" x2="790" y2="266" stroke-dasharray="4 4"/>

  <!-- RPO -->
  <rect x="110" y="86" width="190" height="30" rx="6" fill="#fdecea" stroke="#d93025" stroke-width="1.5"/>
  <text class="on-r lbl" x="205" y="106" text-anchor="middle">RPO — data at risk</text>
  <text class="mut sub" x="110" y="132">committed work not yet replicated</text>

  <!-- RTO -->
  <rect x="300" y="146" width="240" height="34" rx="6" fill="#e6f0fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text class="on-b lbl" x="420" y="168" text-anchor="middle">RTO</text>
  <text class="mut sub" x="308" y="196">DB open · app tier up · LB steered</text>
  <text class="mut sub" x="308" y="211">owner: Infrastructure / DBA</text>

  <!-- WRT -->
  <rect x="540" y="146" width="250" height="34" rx="6" fill="#fef4e0" stroke="#e37400" stroke-width="1.5"/>
  <text class="on-o lbl" x="665" y="168" text-anchor="middle">WRT</text>
  <text class="mut sub" x="548" y="196">cmclean · interface replay · reconcile</text>
  <text class="mut sub" x="548" y="211">owner: EBS functional + Finance</text>

  <!-- MTD bracket -->
  <path d="M300 240 L300 250 L790 250 L790 240" fill="none" stroke="#137333" stroke-width="2.5"/>
  <rect x="470" y="236" width="150" height="28" rx="6" fill="#e3f5e8" stroke="#137333" stroke-width="1.5"/>
  <text class="on-g lbl" x="545" y="255" text-anchor="middle">MTD</text>

  <!-- baseline -->
  <line class="axis" x1="110" y1="286" x2="850" y2="286" stroke-width="1.5"/>

  <!-- event captions -->
  <circle cx="300" cy="286" r="5" fill="#d93025"/>
  <text class="acc-r cap" x="300" y="308" text-anchor="middle">INCIDENT</text>
  <circle cx="540" cy="286" r="4.5" fill="#1a73e8"/>
  <text class="mut cap" x="540" y="308" text-anchor="middle">SYSTEMS AVAILABLE</text>
  <circle cx="790" cy="286" r="4.5" fill="#137333"/>
  <text class="mut cap" x="790" y="308" text-anchor="middle">BUSINESS USABLE</text>
</svg>
